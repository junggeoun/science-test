
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>과학 성향 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 30px; }
        .question { font-size: 1.2em; margin: 20px; }
        button { font-size: 1.1em; padding: 10px 20px; margin: 10px; }
        #result { font-size: 1.5em; margin-top: 40px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔍 과학 성향 테스트</h1>
    <div id="quiz-container">
        <div class="question" id="question">시작합니다!</div>
        <button onclick="answer('O')">⭕ O</button>
        <button onclick="answer('X')">❌ X</button>
    </div>
    <div id="result"></div>

<script>
const questions = [
    { text: "공식과 계산을 활용해 문제를 푸는 것이 재미있다.", points: {P:1, C:1} },
    { text: "복잡한 개념을 도식화하거나 구조로 이해하는 것이 편하다.", points: {C:1, P:1} },
    { text: "생명체나 자연의 모습을 오래 관찰하는 걸 좋아한다.", points: {B:1, E:1} },
    { text: "눈에 보이지 않아도, 그것이 작동하는 방식에 대해 상상해보곤 한다.", points: {C:1, B:1} },
    { text: "실험 결과를 수치로 정리하고 비교하는 것이 익숙하다.", points: {P:1, C:1} },
    { text: "‘왜 그런 현상이 생겼을까?’라는 질문을 자주 던진다.", points: {E:1, P:1} },
    { text: "내가 어떤 정보를 다룰 때, 시각화(그림·표 등)하는 걸 자주 쓴다.", points: {C:1, B:1} },
    { text: "긴 시간 동안의 변화나 흐름을 상상하는 것이 흥미롭다.", points: {E:1, B:1} },
    { text: "현상보다는 원리나 구조를 파악하려는 편이다.", points: {P:1, C:1} },
    { text: "나의 학습은 실험이나 관찰을 직접 해야 이해가 잘 된다.", points: {B:1, C:1} },
    { text: "글보다는 숫자나 도형으로 표현하는 게 편할 때가 있다.", points: {P:1, C:1} },
    { text: "‘이건 왜 이렇게 진화했을까?’ 같은 질문을 흥미롭게 느낀다.", points: {B:1} },
    { text: "자연 현상을 설명할 때, 지역·시간·지형 등을 고려하는 편이다.", points: {E:1} },
    { text: "생각을 정리할 때 개념 간 연결 구조를 그려보는 걸 좋아한다.", points: {C:1, E:1} },
    { text: "과거보다 미래를 예측하고 준비하는 데 더 관심이 많다.", points: {P:1, E:1} }
];

let index = 0;
let scores = {P:0, C:0, B:0, E:0};

function answer(choice) {
    if (choice === 'O') {
        let pts = questions[index].points;
        for (let key in pts) {
            scores[key] += pts[key];
        }
    }
    index++;
    if (index < questions.length) {
        document.getElementById("question").innerText = questions[index].text;
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-container").style.display = "none";
    let max = 0;
    let type = "";
    for (let key in scores) {
        if (scores[key] > max) {
            max = scores[key];
            type = key;
        }
    }
    const labels = {P: "물리(P)형입니다.", C: "화학(C)형입니다.", B: "생명과학(B)형입니다.", E: "지구과학(E)형입니다."};
    document.getElementById("result").innerText = `✅ 당신은 ${labels[type]}`;
}
</script>
</body>
</html>
